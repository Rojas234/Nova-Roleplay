<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Roleplay | SAMP Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --purple-main: #a855f7;
            --bg-color: #020617;
            --glow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--purple-main);
            box-shadow: var(--glow);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo h1 { font-family: 'Orbitron'; color: var(--purple-main); text-shadow: var(--glow); margin: 0; }

        nav ul { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        
        /* ESTILO DE LOS BOTONES DEL MENÚ */
        .nav-link { 
            color: white; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: 0.3s;
            border: none;
            background: none;
            font-family: 'Roboto';
        }
        
        .nav-link:hover { color: var(--purple-main); text-shadow: var(--glow); }

        .btn-discord { background: #5865F2; padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; }

        main { padding: 40px 10%; }

        /* --- CONTROL DE SECCIONES (AQUÍ ESTABA EL FALLO) --- */
        .content-section { 
            display: none !important; /* Oculto por defecto */
        }

        .content-section.active { 
            display: block !important; /* Visible solo si tiene la clase active */
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- DISEÑO STAFF --- */
        .staff-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 30px; }
        .staff-box { 
            background: rgba(30, 27, 75, 0.6); 
            border: 2px solid var(--purple-main); 
            border-radius: 15px; 
            padding: 30px; 
            width: 250px; 
            text-align: center; 
            box-shadow: var(--glow);
        }
        .avatar-container img { width: 120px; height: 120px; border-radius: 15px; border: 2px solid var(--purple-main); margin-bottom: 15px; }
        .rank { display: block; padding: 8px; border-radius: 5px; font-family: 'Orbitron'; font-size: 0.75rem; margin-top: 10px; font-weight: bold; }
        .owner { background: #ef4444; }
        .admin { background: #a855f7; }

        /* --- OTROS ESTILOS --- */
        .status-card { background: rgba(30, 27, 75, 0.4); border: 1px solid var(--purple-main); border-radius: 15px; padding: 30px; text-align: center; box-shadow: var(--glow); }
        .ip-address { display: block; background: #000; padding: 12px; border-radius: 8px; border: 1px dashed var(--purple-main); color: var(--purple-main); margin-top: 15px; font-family: monospace; }
        .online-dot { height: 15px; width: 15px; background-color: #6b7280; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .section-title { font-family: 'Orbitron'; text-align: center; color: var(--purple-main); margin: 40px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h1>NOVA <span>RP</span></h1></div>
        <nav>
            <ul>
                <li><button class="nav-link" onclick="mostrarSeccion('inicio')">Inicio</button></li>
                <li><button class="nav-link" onclick="mostrarSeccion('staff')">Staff</button></li>
                <li><a href="TU_LINK_DISCORD" class="btn-discord" target="_blank">Discord</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="seccion-inicio" class="content-section active">
            <div class="status-card">
                <h3>ESTADO DEL SERVIDOR</h3>
                <div style="display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
                    <span id="status-dot" class="online-dot"></span>
                    <p id="player-info">Consultando...</p>
                </div>
                <code class="ip-address">135.148.164.122:30498</code>
            </div>
            
            <h2 class="section-title">BIENVENIDO A NOVA ROLEPLAY</h2>
            <p style="text-align: center;">Usa el menú de arriba para ver a nuestro equipo administrativo.</p>
        </div>

        <div id="seccion-staff" class="content-section">
            <h2 class="section-title">EQUIPO ADMINISTRATIVO</h2>
            <div class="staff-grid">
                <div class="staff-box">
                    <div class="avatar-container"><img src="https://via.placeholder.com/150" alt="Owner"></div>
                    <h4>Nombre_Owner</h4>
                    <span class="rank owner">OWNER</span>
                </div>
                <div class="staff-box">
                    <div class="avatar-container"><img src="https://via.placeholder.com/150" alt="Admin"></div>
                    <h4>Nombre_Admin</h4>
                    <span class="rank admin">ADMINISTRADOR</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Función ultra-simplificada
        function mostrarSeccion(idDeseada) {
            console.log("Cambiando a: " + idDeseada); // Esto saldrá en la consola (F12) para probar

            // 1. Ocultar TODAS las secciones
            const secciones = document.getElementsByClassName('content-section');
            for (let i = 0; i < secciones.length; i++) {
                secciones[i].classList.remove('active');
            }

            // 2. Mostrar la que queremos
            const seccionMostrar = document.getElementById('seccion-' + idDeseada);
            if (seccionMostrar) {
                seccionMostrar.classList.add('active');
            }
        }

        // Lógica del servidor (Tu IP de Lemehost)
        async function actualizar() {
            const info = document.getElementById('player-info');
            const dot = document.getElementById('status-dot');
            try {
                const res = await fetch(`https://api.samp-servers.net/v2/server/135.148.164.122:30498`);
                const data = await res.json();
                if (data.core.online) {
                    info.innerText = `Jugadores: ${data.core.players} / ${data.core.maxplayers}`;
                    dot.style.backgroundColor = "#22c55e";
                    dot.style.boxShadow = "0 0 15px #22c55e";
                }
            } catch (e) {
                info.innerText = "Servidor Offline";
                dot.style.backgroundColor = "#ef4444";
            }
        }
        actualizar();
        setInterval(actualizar, 30000);
    </script>
</body>
</html>
