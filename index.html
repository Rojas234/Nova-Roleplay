<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Roleplay | SAMP Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --purple-main: #a855f7;
            --purple-dark: #1e1b4b;
            --bg-color: #020617;
            --text-white: #f8fafc;
            --glow: 0 0 15px rgba(168, 85, 247, 0.6);
            --red-owner: #ef4444;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--purple-main);
            box-shadow: var(--glow);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo h1 { font-family: 'Orbitron'; color: var(--purple-main); text-shadow: var(--glow); margin: 0; font-size: 1.5rem; }
        .logo span { color: white; }

        nav ul { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        
        .nav-link { 
            color: white; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: 0.3s;
            border: none;
            background: none;
            font-family: 'Roboto';
        }
        
        .nav-link:hover { color: var(--purple-main); text-shadow: var(--glow); }

        .btn-discord { background: #5865F2; padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; font-weight: bold; }

        main { padding: 40px 10%; }

        .content-section { display: none !important; }
        .content-section.active { display: block !important; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(30, 27, 75, 0.4);
            border: 1px solid var(--purple-main);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--glow);
            backdrop-filter: blur(8px);
        }

        .card h3 { 
            margin-top: 0; 
            color: var(--purple-main); 
            font-family: 'Orbitron'; 
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            padding-bottom: 10px;
        }

        .status-box { text-align: center; }
        .ip-address { 
            display: block; 
            background: #000; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px dashed var(--purple-main); 
            color: var(--purple-main); 
            margin-top: 15px; 
            font-family: monospace;
            font-size: 1.1rem;
        }
        .online-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; background-color: #ef4444; transition: 0.5s; }

        .staff-grid
